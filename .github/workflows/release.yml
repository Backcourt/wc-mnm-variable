# Deploy Backcourt Mini Extension.
# Version: 2.0.0
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
    push:
        tags:
            # Semver (https://semver.org/) release pattern.
            - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
    # Build distribution release.
    #
    # Performs the following steps:
    # - Checks out the repository.
    # - Read package.json info.
    # - Sets up PHP with Composer and WP-CLI (WP-CLI generates the .pot file).
    # - Get Composer Cache Directory.
    # - Sets up Composer Caching.
    # - Logs debug information.
    # - Install Composer dependencies (prefixed with Strauss).
    # - Generate POT file.
    # - Setup NodeJS.
    # - Install NPM dependencies.
    # - Get release version.
    # - Check for Alpha release.
    # - Check for Beta release.
    # - Check for Release Candidate release.
    # - Logs debug information.
    # - Build changelog from commits.
    # - Build release:
    #    - Pre-release.
    #    - Stable.
    # - Verify the release zip.
    # - Add package to GitHub releases.
    # - Clear Git Updater cache on backcourt.io.

    dist:
        name: 'Build distribution release.'
        runs-on: ubuntu-latest
        env:
            release: stable
        steps:
            - name: 'Checks out the repository.'
              uses: 'actions/checkout@v7'
              with:
                # Full history and tags, so we can find the previous tag.
                fetch-depth: 0

            - name: Read package.json info
              id: package_info
              run: |
                VERSION=$(jq -r '.version' package.json)
                NAME=$(jq -r '.name' package.json)
                GU_SLUG=$(jq -r '."git-updater-slug" // empty' package.json)
                GU_SLUG=${GU_SLUG:-$NAME}
                echo "release_tag=$VERSION" >> $GITHUB_ENV
                echo "release_name=$NAME" >> $GITHUB_ENV
                echo "git_updater_slug=$GU_SLUG" >> $GITHUB_ENV

            - name: 'Sets up PHP with Composer and WP-CLI.'
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer, wp-cli
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: 'Get Composer Cache Directory.'
              id: composer-cache
              run: |
                  echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: 'Sets up Composer Caching.'
              uses: 'actions/cache@v6'
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-php-composer-build-${{ hashFiles('**/composer.json', '**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-composer-build-

            - name: 'Logs debug information.'
              run: |
                  php --version
                  composer --version
                  wp --allow-root --version

            - name: 'Install production Composer dependencies.'
              run: |
                  composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Uses the WP-CLI installed by setup-php, which bundles the i18n command.
            - name: "Generate POT file."
              run: |
                composer makepot

            - name: "Verify prefixed packages."
              run: |
                if [ ! -f ./vendor-prefixed/autoload.php ]; then
                  echo "::error::vendor-prefixed/autoload.php missing. Strauss did not run."
                  exit 1
                fi

            - name: 'Setup NodeJS.'
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - name: 'Install NPM dependencies.'
              run: npm ci

            - name: 'Check for Alpha release.'
              if: ${{ contains(env.release_tag, '-alpha') }}
              run: |
                  echo "release_status=pre-release" >> $GITHUB_ENV

            - name: 'Check for Beta release.'
              if: ${{ contains(env.release_tag, '-beta') }}
              run: |
                  echo "release_status=pre-release" >> $GITHUB_ENV

            - name: 'Check for Release Candidate release.'
              if: ${{ contains(env.release_tag, '-rc') }}
              run: |
                  echo "release_status=pre-release" >> $GITHUB_ENV

            - name: 'Logs debug information.'
              run: |
                  node --version
                  npm --version
                  echo ${{ env.release_tag }}
                  echo ${{ env.release_status }}
                  echo ${{ env.git_updater_slug }}
                  
              # Release notes are the commit subjects since the previous tag, minus version bumps.
            - name: "Build changelog from commits."
              env:
                TAG: ${{ github.ref_name }}
              run: |
                prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
                range="${prev:+$prev..}$TAG"
                {
                  echo "## Changelog"
                  echo
                  git log "$range" --no-merges --pretty=format:'- %s' \
                    | grep -viE '^- version bump|^- version [0-9]|^- [0-9]+\.[0-9]+\.[0-9]+' || true
                } > release-notes.md
                cat release-notes.md

            - name: 'Build release: Pre-release'
              if: ${{ env.release_status == 'pre-release' }}
              run: |
                  npm run betarelease

            - name: 'Build release: Stable'
              if: ${{ env.release_status != 'pre-release' }}
              run: |
                  npm run release

            - name: 'Verify the release zip.'
              run: |
                  zip="./deploy/${{ env.release_name }}-${{ env.release_tag }}.zip"
                  dir="${{ env.release_name }}"
                  if [ ! -f "$zip" ]; then
                    echo "::error::Release zip not found at $zip"
                    exit 1
                  fi
                  files="$(unzip -Z1 "$zip")"
                  for file in vendor-prefixed/autoload.php languages/${{ env.release_name }}.pot; do
                    if ! echo "$files" | grep -qx "$dir/$file"; then
                      echo "::error::$file is missing from the release zip."
                      exit 1
                    fi
                  done
                  if echo "$files" | grep -q "strauss.phar\|^$dir/vendor/\|^$dir/node_modules/"; then
                    echo "::error::Build tools or unprefixed vendor packages found in the release zip."
                    exit 1
                  fi

            - name: 'Add package to GitHub releases.'
              uses: softprops/action-gh-release@v3
              with:
                  files: ./deploy/${{ env.release_name }}-${{ env.release_tag }}.zip
                  body_path: ${{ env.release_notes }}
                  prerelease: ${{ env.release_status == 'pre-release' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Tell backcourt.io's Git Updater to drop its cached repo data so the new
            # release is served on the next update check. The endpoint returns 200
            # even on a bad key, so check the body for success.
            - name: "Clear Git Updater cache."
              if: ${{ env.release_status != 'pre-release' }}
              env:
                GU_KEY: ${{ secrets.BACKCOURT_GITUPDATER_KEY }}
              run: |
                echo "Clearing Git Updater cache for $GU_SLUG…"
                response=$(curl -fsS -X POST "https://www.backcourt.io/wp-json/git-updater/v1/flush-repo-cache/" \
                  --data-urlencode "slug=${{ env.git_updater_slug }}" \
                  --data-urlencode "key=$GU_KEY")
                echo "$response"
                if ! echo "$response" | grep -q '"success":true'; then
                  echo "::error::Git Updater cache flush failed."
                  exit 1
                fi